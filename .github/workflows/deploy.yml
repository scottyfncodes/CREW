name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main, master, claude/crew-master-build-d8mjlg]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Per-ref, so a push to a development branch runs its tests without queueing
# behind — or blocking — a deploy from the default branch.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # enablement turns Pages on for the repo on the first run.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # The github-pages environment carries a deployment branch policy that
      # is pinned when Pages is first enabled. If it does not list the branch
      # we build from, the deploy job below is rejected before it runs a
      # single step, with no log of its own explaining why. GITHUB_TOKEN
      # cannot edit that policy, so report it here where it is readable.
      - name: Report the Pages deployment branch policy
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          policy=$(gh api "repos/$REPO/environments/github-pages" \
            --jq '.deployment_branch_policy | if . == null then "none" else (if .custom_branch_policies then "custom" else "protected" end) end' \
            2>/dev/null || echo unknown)
          echo "Deploying from: $BRANCH"
          echo "Deployment branch policy: $policy"

          case "$policy" in
            none)
              echo "All branches may deploy." ;;
            custom)
              allowed=$(gh api "repos/$REPO/environments/github-pages/deployment-branch-policies" \
                --jq '.branch_policies[].name' 2>/dev/null || true)
              echo "Allowed branches:"; echo "$allowed"
              if ! printf '%s\n' "$allowed" | grep -qx "$BRANCH"; then
                echo "::warning::$BRANCH is not in the github-pages environment's allowed branches, so the deploy job will be rejected. Add it under Settings -> Environments -> github-pages -> Deployment branches, or set that to 'No restriction'."
              fi ;;
            protected)
              echo "::warning::The github-pages environment allows protected branches only. Add $BRANCH under Settings -> Environments -> github-pages -> Deployment branches, or set that to 'No restriction'." ;;
            *)
              echo "Could not read the policy with this token." ;;
          esac

  # Only the default branch can publish: the github-pages environment's
  # deployment branch policy allows main alone, so attempting this from any
  # other branch produces a rejected job with no log rather than a useful
  # failure. Other branches still get the full build and test run above.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
